<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, follow" />
  <title>Continue to URAL flight search</title>
  <link rel="stylesheet" href="/fonts/fonts.css" />
  <style>
    :root { color-scheme: light; --navy: #0B1426; --gold: #F6B73C; --emerald: #0F4A3F; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #F5F1E8; color: var(--navy); font-family: Inter, "Noto Sans Bengali", sans-serif; }
    main { max-width: 44rem; margin: 0 auto; padding: 32px 24px; }
    h1 { font-size: 30px; line-height: 1.4; margin: 0 0 16px; }
    p { line-height: 1.6; }
    a { color: var(--emerald); text-underline-offset: 3px; }
    a:focus-visible { outline: 3px solid var(--emerald); outline-offset: 4px; }
    #continue-search { display: inline-flex; min-height: 48px; align-items: center; padding: 12px 20px; border-radius: 20px; background: var(--gold); color: var(--navy); font-weight: 700; text-decoration: none; }
    #continue-search:hover, #continue-search:active { background: #D4941A; }
    ::selection { background: var(--gold); color: var(--navy); }
  </style>
</head>
<body>
  <main>
    <h1 id="heading">Continue to URAL flight search</h1>
    <p id="description">Flight search now opens on flights.uraltravel.co.uk. Review your trip on the flight site.</p>
    <a id="continue-search" href="https://flights.uraltravel.co.uk/?currency=BDT&amp;locale=en" target="_blank" rel="noopener noreferrer sponsored">Open flight search</a>
    <p><a id="planner" href="/flights" target="_top">Return to the flight planner</a></p>
  </main>
  <script>
    // Preview/static-host fallback for the Pages Function redirect. Keep its
    // allowlist in step with getLegacyWhiteLabelUrl; the integration tests
    // exercise both with the same bookmarks. A cached iframe gets a link, not
    // another embedded search engine.
    (function () {
      var source = new URL(window.location.href);
      var target = new URL('https://flights.uraltravel.co.uk/');
      var code = source.searchParams.get('flightSearch') || '';
      var currency = (source.searchParams.get('currency') || 'BDT').toUpperCase();
      var locale = (source.searchParams.get('locale') || source.searchParams.get('lang') || 'en').toLowerCase() === 'bn' ? 'bn' : 'en';
      if (/^[A-Z]{3}\d{4}[A-Z]{2,3}(?:\d{4})?[cwf]?[1-9]\d{0,2}$/.test(code)) target.searchParams.set('flightSearch', code);
      target.searchParams.set('currency', ['BDT', 'USD', 'EUR', 'GBP', 'SAR', 'AED', 'CNY'].includes(currency) ? currency : 'BDT');
      target.searchParams.set('locale', locale);
      document.getElementById('continue-search').href = target.href;
      if (locale === 'bn') {
        document.documentElement.lang = 'bn';
        document.title = 'URAL ফ্লাইট সার্চ খুলুন';
        document.getElementById('heading').textContent = 'URAL ফ্লাইট সার্চ খুলুন';
        document.getElementById('description').textContent = 'ফ্লাইট সার্চ এখন flights.uraltravel.co.uk-এ খুলবে। সেখানে আপনার যাত্রার তথ্য মিলিয়ে নিন।';
        document.getElementById('continue-search').textContent = 'ফ্লাইট সার্চ খুলুন';
        document.getElementById('planner').textContent = 'ফ্লাইট প্ল্যানারে ফিরে যান';
        document.getElementById('planner').href = '/bn/flights';
      }
      if (window.top === window) window.location.replace(target.href);
    })();
  </script>
</body>
</html>
