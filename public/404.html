<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#0B1426" />
    <title>Page not found | URAL</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon/favicon-32.png" />
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; color: #0B1426; background: #F5F1E8; }
      main { width: min(100%, 620px); padding: clamp(28px, 7vw, 56px); border: 1px solid #E7E0D5; border-radius: 24px; background: white; box-shadow: 0 18px 55px rgb(11 20 38 / 8%); }
      .brand { color: #0B1426; font-size: 13px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
      .code { margin: 30px 0 8px; color: #0F4A3F; font-size: 12px; font-weight: 800; letter-spacing: .14em; }
      h1 { margin: 0; font-size: clamp(30px, 6vw, 44px); line-height: 1.1; }
      p { color: #475569; line-height: 1.65; }
      nav { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }
      a { display: inline-flex; align-items: center; min-height: 42px; padding: 10px 14px; border-radius: 10px; color: #0B1426; font-size: 14px; font-weight: 700; text-decoration: none; background: #FBF9F4; }
      a:first-child { color: white; background: #0B1426; }
      a:hover { outline: 2px solid #F6B73C; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">URAL · Travel from Bangladesh</div>
      <div class="code">ERROR 404</div>
      <h1>We can’t find that page.</h1>
      <p>The address may have changed or the page may no longer be available. Start with a travel hub or browse the full guide directory.</p>
      <nav aria-label="Helpful links">
        <a href="/">Go to URAL home</a>
        <a href="/blog">Travel guides</a>
        <a href="/sitemap">Browse all pages</a>
      </nav>
    </main>
  </body>
</html>
