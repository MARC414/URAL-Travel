<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="AirHelp flight compensation promo card">
  <defs>
    <linearGradient id="bgA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1426"/>
      <stop offset="100%" stop-color="#3A1F2B"/>
    </linearGradient>
    <linearGradient id="accentA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D4941A"/>
      <stop offset="100%" stop-color="#F0B429"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bgA)" rx="28"/>
  <rect x="48" y="48" width="1104" height="579" rx="20" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <rect x="72" y="72" width="260" height="42" rx="21" fill="rgba(212,148,26,0.18)" stroke="rgba(212,148,26,0.45)"/>
  <text x="202" y="99" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#F0B429">FLIGHT COMPENSATION</text>
  <text x="72" y="170" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" fill="#FFFFFF">AirHelp</text>
  <text x="72" y="215" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#CBD5E1">Check eligibility and get claim support after flight disruptions</text>
  <rect x="72" y="260" width="520" height="2" fill="url(#accentA)"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#E2E8F0">
    <circle cx="88" cy="318" r="7" fill="#F0B429"/><text x="112" y="327">Eligibility depends on route, airline, disruption, and applicable rule</text>
    <circle cx="88" cy="378" r="7" fill="#F0B429"/><text x="112" y="387">No guaranteed payout — keep booking and disruption documents</text>
    <circle cx="88" cy="438" r="7" fill="#F0B429"/><text x="112" y="447">Verify current service fees and live terms before submitting a claim</text>
  </g>
  <rect x="72" y="500" width="420" height="72" rx="16" fill="url(#accentA)"/>
  <text x="282" y="545" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#0B1426">Check live promo terms</text>
  <text x="72" y="610" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#94A3B8">Editorial promo card by URAL • Not an official brand banner • Verify live terms before purchase</text>
</svg>
