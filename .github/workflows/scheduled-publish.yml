name: Scheduled blog publishing

on:
  # 03:00 UTC is 09:00 Asia/Dhaka. GitHub may queue scheduled workflows a few
  # minutes late; the article remains hidden until the Cloudflare rebuild lands.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      include_overdue:
        description: Include scheduled articles whose publish date has passed
        required: false
        # Default true: the nightly job uses strict date equality, so a post the
        # schedule missed on its own day is otherwise missed forever. The build
        # itself (isPostIncludedInBuild) is time-based and always includes
        # overdue posts; this input only gates whether the nightly *checker*
        # notices them and fires the Cloudflare rebuild hook.
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: scheduled-blog-publish
  cancel-in-progress: false

jobs:
  publish-due-posts:
    name: Check Dhaka publish dates and rebuild Pages if due
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check for posts scheduled for today in Dhaka
        id: due
        env:
          INCLUDE_OVERDUE: ${{ inputs.include_overdue }}
        run: npm run scheduled:check -- --github-output

      - name: Trigger Cloudflare Pages production rebuild
        if: steps.due.outputs.publish == 'true'
        env:
          CLOUDFLARE_PAGES_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
        run: |
          if [[ -z "${CLOUDFLARE_PAGES_DEPLOY_HOOK:-}" ]]; then
            echo "::error::Missing repository secret CLOUDFLARE_PAGES_DEPLOY_HOOK. Add the Cloudflare Pages deploy-hook URL in GitHub Actions secrets."
            exit 1
          fi
          status="$(curl --silent --show-error --fail --output /dev/null --write-out '%{http_code}' --request POST "$CLOUDFLARE_PAGES_DEPLOY_HOOK")"
          echo "Cloudflare Pages accepted the scheduled rebuild (HTTP ${status})."

      - name: All due posts verified live — no rebuild
        if: steps.due.outputs.publish != 'true'
        run: |
          echo "No article requires a rebuild: nothing is due, or every due/overdue post is already live"
          echo "on the production sitemap (checked=${{ steps.due.outputs.sitemap_checked }}, missing=${{ steps.due.outputs.missing_slugs }})."
          echo "Cloudflare was not triggered."
