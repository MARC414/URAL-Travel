name: Weekly Affiliate Link & Offer Lifecycle Audit

on:
  schedule:
    # Runs every Monday at 03:00 UTC (09:00 AM Bangladesh Standard Time)
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  audit-affiliate-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit Travelpayouts links and offer lifecycle status
        run: npm run check:affiliates -- --http
